<!doctype html>
<!-- The Gen2 page's pod, for tools/source/pod-stills.mjs to photograph. Served from the repo's
     root (tools/serve.mjs), so the base makes the site's own asset paths resolve. -->
<html>
<head>
  <meta charset="utf-8">
  <base href="/">
  <style>
    html, body { margin: 0; background: transparent; }
    canvas { display: block; width: 64px; height: 64px; }
  </style>
</head>
<body>
  <canvas id="pod"></canvas>
  <script src="assets/pod-assets.js"></script>
  <script src="tools/source/pod-scene.js"></script>
</body>
</html>
